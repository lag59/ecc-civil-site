<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Down for Maintenance</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#121a33;
      --card: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.16);
      --text:#f5f7ff;
      --muted: rgba(245,247,255,0.75);
      --accent:#7aa7ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(122,167,255,0.25), transparent 55%),
        radial-gradient(900px 600px at 90% 20%, rgba(255,122,168,0.18), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }
    .card{
      width:min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:999px;
      background: rgba(122,167,255,0.12);
      border: 1px solid rgba(122,167,255,0.25);
      color: var(--text);
      font-weight: 600;
      letter-spacing: .2px;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(122,167,255,0.15);
      margin-left:2px;
    }
    h1{
      margin:14px 0 8px;
      font-size: clamp(26px, 3.5vw, 40px);
      line-height:1.15;
    }
    p{
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 16px;
      line-height:1.6;
    }
    .meta{
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.10);
      display:flex;
      flex-wrap:wrap;
      gap:10px 16px;
      color: rgba(245,247,255,0.70);
      font-size: 14px;
    }
    .meta strong{ color: rgba(245,247,255,0.92); font-weight:600; }
    .btns{ margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
    a.btn{
      display:inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration:none;
      font-weight:600;
    }
    a.btn:hover{ background: rgba(255,255,255,0.10); }
    .small{ font-size:13px; color: rgba(245,247,255,0.55); margin-top:10px; }
  </style>
</head>
<body>
  <main class="card" role="main" aria-live="polite">
    <div class="badge"><span class="dot"></span> Scheduled maintenance</div>

    <h1>We’ll be right back.</h1>
    <p>
      ECC Civil is temporarily down for maintenance while we perform updates.
      Please check back shortly.
    </p>

    <div class="meta">
      <div><strong>Status:</strong> Maintenance in progress</div>
      <div><strong>ETA:</strong> Shortly</div>
      <div><strong>Contact:</strong> <a style="color:inherit" href="mailto:Admin@ecccivil.com">Admin@ecccivil.com</a></div>
    </div>

    <div class="btns">
      <a class="btn" href="/" onclick="location.reload(); return false;">Retry</a>
      <a class="btn" href="mailto:Admin@ecccivil.com">Email support</a>
    </div>

    <div class="small">Thank you for your patience.</div>
  </main>
</body>
</html>
